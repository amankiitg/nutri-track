# Render Blueprint for the parse-meal service and the orphan-photo sweeper.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository. Render reads
# this file and builds only server/, which is why server/ is a standalone npm
# package with its own lockfile.
#
# Secrets are never written here. Every value that matters is marked `sync: false`, so
# Render asks for it on the first deploy and holds it in the dashboard — this file
# commits key names and nothing else. The only literal values below are NODE_VERSION
# and SWEEP_DRY_RUN, neither of which is a secret.
#
# The frontend is not described here: it is a static build served elsewhere
# (Cloudflare Workers via Nitro, or any static host), and it only needs
# VITE_PARSE_MEAL_URL pointed at this service's URL.

services:
  - type: web
    name: nutritrack-parse-meal
    runtime: node
    # NOT free. A free instance sleeps after ~15 minutes idle, and the next request
    # pays a cold start of tens of seconds — which is precisely the wrong thing to
    # meet at a dinner table, holding a phone, waiting to log a meal. The whole point
    # of this service is a fast answer to an occasional request.
    plan: starter

    # Build and run from server/. The relative import of ../../shared/meal-parse is
    # inlined into the bundle by esbuild, so the deployed artifact does not reach
    # outside this directory.
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start

    # Render polls this and will not cut traffic over to a deploy that fails it.
    healthCheckPath: /health

    envVars:
      # Match the local runtime; parse-meal targets node22 in its esbuild step.
      - key: NODE_VERSION
        value: "22"

      # NOTE: PORT is deliberately absent. Render injects it, and the service
      # defaults to 8787 only when it is missing.

      # --- Supabase -----------------------------------------------------------
      - key: SUPABASE_URL
        sync: false
      # Public value, the same one the browser has. Needed for the `apikey` header.
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      # --- Google Gemini ------------------------------------------------------
      - key: GEMINI_API_KEY
        sync: false
      # The stable model id from AI Studio, e.g. gemini-3.8-flash.
      - key: GEMINI_VISION_MODEL
        sync: false

      # --- CORS ---------------------------------------------------------------
      # Comma-separated. Must list the origin the frontend is actually served from.
      # Locally that is http://localhost:8080; in production it is the deployed
      # frontend's origin and nothing else. A request from an origin not listed here
      # is refused before a handler runs, so getting this wrong looks like the service
      # being down.
      - key: ALLOWED_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # The orphan-photo sweeper (server/scripts/sweep-orphan-photos.ts).
  #
  # A cron job rather than anything inside the web service: it is the only thing in
  # this repository that reads SUPABASE_SERVICE_ROLE_KEY, and keeping it in its own
  # service is what stops that key from reaching the request path.
  #
  # It shares the build with the web service — `npm run build` emits both dist/index.js
  # and dist/sweep.js — so a failed build fails both and they cannot drift apart.
  #
  # Schedule is cron in UTC. 04:00 UTC is early morning in Europe and late evening in
  # the Americas, which is when the fewest captures are in flight. Nothing depends on
  # the hour: the grace period, not the schedule, is what protects a capture in progress.
  #
  # THE FIRST DEPLOYS ARE DRY RUNS. `command` has no --live and SWEEP_DRY_RUN defaults
  # to true, so this deletes nothing until you say so. To go live, set SWEEP_DRY_RUN to
  # false on this service in Render's dashboard; no commit and no redeploy are needed.
  # See README.md, "Going live with the sweeper".
  # ---------------------------------------------------------------------------
  - type: cron
    name: nutritrack-sweep-orphan-photos
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    schedule: "0 4 * * *"
    # The built bundle, not `npm run sweep`. The cron run should execute exactly what
    # the build produced, so a passing build is the whole guarantee — no dependency on
    # devDependencies being installed at run time.
    command: node dist/sweep.js
    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: SUPABASE_URL
        sync: false
      # Same public value the web service has. Storage rejects a request with no
      # `apikey` header, so even the service role needs it present.
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # The one secret that bypasses RLS. This service and no other. It is optional to
      # the parse-meal web service, which must never have it.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Dry run unless this is explicitly "false". Anything unrecognised stops the job
      # rather than being guessed at. Set to "false" once a dry run looks right.
      - key: SWEEP_DRY_RUN
        value: "true"
