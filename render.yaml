# Render Blueprint for the parse-meal service and the orphan-photo sweeper.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository. Render reads
# this file and builds only server/, which is why server/ is a standalone npm
# package with its own lockfile.
#
# Validate any edit against Render's Blueprint spec before pushing: a rejected file
# fails the whole deploy, including the service that was already working.
#
# Secrets are never written here. Every value that matters is marked `sync: false`, so
# Render asks for it on the first deploy and holds it in the dashboard — this file
# commits key names and nothing else. The only literal values below are NODE_VERSION
# and SWEEP_DRY_RUN, neither of which is a secret.
#
# The frontend is not described here: it is a static build served elsewhere
# (Cloudflare Workers via Nitro, or any static host), and it only needs
# VITE_PARSE_MEAL_URL pointed at this service's URL.

services:
  - type: web
    name: nutritrack-parse-meal
    runtime: node
    # NOT free. A free instance sleeps after ~15 minutes idle, and the next request
    # pays a cold start of tens of seconds — which is precisely the wrong thing to
    # meet at a dinner table, holding a phone, waiting to log a meal. The whole point
    # of this service is a fast answer to an occasional request.
    plan: starter

    # Build and run from server/. The relative import of ../../shared/meal-parse is
    # inlined into the bundle by esbuild, so the deployed artifact does not reach
    # outside this directory.
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start

    # Render polls this and will not cut traffic over to a deploy that fails it.
    healthCheckPath: /health

    envVars:
      # Match the local runtime; parse-meal targets node22 in its esbuild step.
      - key: NODE_VERSION
        value: "22"

      # NOTE: PORT is deliberately absent. Render injects it, and the service
      # defaults to 8787 only when it is missing.

      # --- Supabase -----------------------------------------------------------
      - key: SUPABASE_URL
        sync: false
      # Public value, the same one the browser has. Needed for the `apikey` header.
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      # --- Google Gemini ------------------------------------------------------
      - key: GEMINI_API_KEY
        sync: false
      # The stable model id from AI Studio, e.g. gemini-3.8-flash.
      - key: GEMINI_VISION_MODEL
        sync: false
      # Optional: a token budget for text-only analyses. Absent means the model's
      # own minimum, which is the normal case, so the service starts without it.
      - key: TEXT_THINKING_BUDGET
        sync: false

      # --- Daily analysis limit -----------------------------------------------
      # How many meal analyses one account gets per local day. Empty means the
      # defaults in `shared/meal-parse.ts`: 20 for a normal account, 60 for an
      # admin. `/analysis-limit` reports whatever is set here, so the app cannot
      # display a different number from the one this service enforces.
      - key: DAILY_ANALYSIS_LIMIT
        sync: false
      - key: ADMIN_DAILY_ANALYSIS_LIMIT
        sync: false

      # --- Free trial ----------------------------------------------------------
      # All four secrets are optional; with any missing /try answers that the
      # trial is unavailable rather than running unprotected. The per-mailbox and
      # global-per-day limits live in the database's trial_settings table, not here.
      - key: TURNSTILE_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TRIAL_TOKEN_SECRET
        sync: false
      # The trial server secret: this service passes it as p_server_secret to the
      # trial_* database functions, and the matching value lives in Supabase Vault
      # under the name 'trial_server_secret'. The two must agree or every call fails.
      - key: TRIAL_SERVER_SECRET
        sync: false

      # --- Mailing list --------------------------------------------------------
      # The audience named "NutriTrack list" in Resend. Not a secret.
      - key: RESEND_AUDIENCE_ID
        sync: false
      # The value passed as p_secret to the email_sync_* functions; the matching
      # copy lives in Supabase Vault as 'email_sync_server_secret'. The same secret
      # is on the nightly resend-sync cron. Without it /contacts/sync says the
      # mailing list is not set up.
      - key: EMAIL_SYNC_SECRET
        sync: false
      # Whether /try asks for an email and a 6-digit code. False (the default) is the
      # anonymous trial: Turnstile, then a token, with no email and no Resend. True
      # restores the old flow exactly and makes RESEND_API_KEY required.
      - key: TRIAL_REQUIRE_EMAIL
        sync: false

      # --- CORS ---------------------------------------------------------------
      # Comma-separated. Must list the origin the frontend is actually served from.
      # Locally that is http://localhost:8080; in production it is the deployed
      # frontend's origin and nothing else. A request from an origin not listed here
      # is refused before a handler runs, so getting this wrong looks like the service
      # being down.
      - key: ALLOWED_ORIGINS
        sync: false

      # --- Gmail, for the admin invite feature --------------------------------
      # These are the only secrets this service holds, and they must never appear
      # in a response, a log or an error. `server/src/gmail.ts` is the only thing
      # that reads them and it scrubs them from everything it logs.
      #
      # An OAuth refresh token rather than an app password, because this now lives
      # on Render: it is revocable on its own, scoped, and shows up as a named app
      # in the account's third-party access list. `npm run gmail:consent` (from
      # server/, on a laptop) is the one-time step that produces it.
      #
      # Optional: with any of these missing the service still starts and serves
      # /parse-meal, and /invite answers that the feature is not set up.
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_REFRESH_TOKEN
        sync: false
      # The mailbox the drafts are created in. Not a secret.
      - key: INVITE_SENDER_ADDRESS
        sync: false

  # ---------------------------------------------------------------------------
  # The orphan-photo sweeper (server/scripts/sweep-orphan-photos.ts).
  #
  # A cron job rather than anything inside the web service: it is the only thing in
  # this repository that reads SUPABASE_SERVICE_ROLE_KEY, and keeping it in its own
  # service is what stops that key from reaching the request path.
  #
  # It shares the build with the web service — `npm run build` emits both dist/index.js
  # and dist/sweep.js — so a failed build fails both and they cannot drift apart.
  #
  # Schedule is cron in UTC. 04:00 UTC is early morning in Europe and late evening in
  # the Americas, which is when the fewest captures are in flight. Nothing depends on
  # the hour: the grace period, not the schedule, is what protects a capture in progress.
  #
  # THE FIRST DEPLOYS ARE DRY RUNS. `startCommand` has no --live and SWEEP_DRY_RUN
  # defaults to true, so this deletes nothing until you say so. To go live, set
  # SWEEP_DRY_RUN to false on this service in Render's dashboard; no commit and no
  # redeploy are needed. See README.md, "Going live with the sweeper".
  #
  # `starter`, not `free`: the free instance type is not offered for cron jobs. Cron
  # jobs bill by run time rather than continuously, and this one finishes in seconds,
  # so the cost is negligible.
  # ---------------------------------------------------------------------------
  - type: cron
    name: nutritrack-sweep-orphan-photos
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    schedule: "0 4 * * *"
    # `startCommand`, the same field a web service uses; cron jobs have no `command`.
    #
    # The built bundle, not `npm run sweep`. The cron run should execute exactly what
    # the build produced, so a passing build is the whole guarantee — no dependency on
    # devDependencies being installed at run time.
    startCommand: node dist/sweep.js
    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: SUPABASE_URL
        sync: false
      # Same public value the web service has. Storage rejects a request with no
      # `apikey` header, so even the service role needs it present.
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # The one secret that bypasses RLS. This service and no other. It is optional to
      # the parse-meal web service, which must never have it.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Dry run unless this is explicitly "false". Anything unrecognised stops the job
      # rather than being guessed at. Set to "false" once a dry run looks right.
      - key: SWEEP_DRY_RUN
        value: "true"

  # ---------------------------------------------------------------------------
  # The mailing list sync (server/scripts/resend-sync.ts).
  #
  # Keeps the Resend audience named "NutriTrack list" in step with who can use the
  # app: one contact per inbox, an unsubscribe when somebody turns product mail off,
  # and never a re-subscribe. It sends no email; Resend's Contacts API is the only
  # thing it calls.
  #
  # It needs no SUPABASE_SERVICE_ROLE_KEY and must never be given one. The list is
  # read through email_sync_page(), a security definer function gated by
  # EMAIL_SYNC_SECRET against Supabase Vault's 'email_sync_server_secret'. That is
  # the difference between this job and the sweeper: the sweeper must see every
  # meal, and this must see only addresses it can name one page at a time.
  #
  # 06:00 UTC is chosen, not measured: it is after the sweeper and before the
  # working day in Europe. Nothing depends on the hour, and the admin page can run
  # the same sync on demand.
  #
  # Shares the build with the web service, so a failed build fails both and they
  # cannot drift. The first deploy does nothing until RESEND_AUDIENCE_ID is set.
  # ---------------------------------------------------------------------------
  - type: cron
    name: nutritrack-resend-sync
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    schedule: "0 6 * * *"
    startCommand: node dist/resend-sync.js
    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      # The same Resend key the trial uses. It can create a contact and set one
      # unsubscribed; it cannot send from this job, because no send path is called.
      - key: RESEND_API_KEY
        sync: false
      # The audience id from Resend's dashboard, not a secret. "NutriTrack list".
      - key: RESEND_AUDIENCE_ID
        sync: false
      # Must match the Vault secret named 'email_sync_server_secret'. A mismatch is
      # a refused run, not a half synced list.
      - key: EMAIL_SYNC_SECRET
        sync: false
